name: Build BALI COCKTAIL

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate application sources
        shell: bash
        run: |
          cat scripts/bootstrap.part.* > /tmp/bootstrap.sh
          chmod +x /tmp/bootstrap.sh
          /tmp/bootstrap.sh generated
          chmod +x scripts/apply-overrides.sh
          scripts/apply-overrides.sh generated

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build APK
        shell: bash
        run: gradle -p generated/android :app:assembleDebug --stacktrace

      - name: Prepare Android installer
        shell: bash
        run: |
          mkdir -p out/android
          cp generated/android/app/build/outputs/apk/debug/app-debug.apk out/android/BALI-COCKTAIL.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BALI-COCKTAIL-Android-APK
          path: out/android/BALI-COCKTAIL.apk
          if-no-files-found: error
          retention-days: 30

  ios-unsigned:
    name: iOS unsigned build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate application sources
        shell: bash
        run: |
          cat scripts/bootstrap.part.* > /tmp/bootstrap.sh
          chmod +x /tmp/bootstrap.sh
          /tmp/bootstrap.sh generated
          chmod +x scripts/apply-overrides.sh
          scripts/apply-overrides.sh generated

      - name: Prepare iOS assets
        shell: bash
        run: |
          set -euo pipefail
          IOS_DIR="generated/ios/BALI_COCKTAIL"
          ASSETS="$IOS_DIR/Assets.xcassets"
          rm -rf "$ASSETS"/cocktail_*.imageset
          mkdir -p "$ASSETS/AppIcon.appiconset"
          printf '%s\n' '{"info":{"author":"xcode","version":1}}' > "$ASSETS/Contents.json"
          cp generated/android/app/src/main/assets/cocktails.json "$IOS_DIR/cocktails.json"
          sips -s format png -z 1024 1024 generated/android/app/src/main/res/drawable/ic_launcher.jpg --out "$ASSETS/AppIcon.appiconset/appicon-1024.png" >/dev/null
          sips -z 120 120 "$ASSETS/AppIcon.appiconset/appicon-1024.png" --out "$ASSETS/AppIcon.appiconset/appicon-120.png" >/dev/null
          sips -z 180 180 "$ASSETS/AppIcon.appiconset/appicon-1024.png" --out "$ASSETS/AppIcon.appiconset/appicon-180.png" >/dev/null
          sips -z 152 152 "$ASSETS/AppIcon.appiconset/appicon-1024.png" --out "$ASSETS/AppIcon.appiconset/appicon-152.png" >/dev/null
          sips -z 167 167 "$ASSETS/AppIcon.appiconset/appicon-1024.png" --out "$ASSETS/AppIcon.appiconset/appicon-167.png" >/dev/null
          cat > "$ASSETS/AppIcon.appiconset/Contents.json" <<'JSON'
          {"images":[
            {"filename":"appicon-120.png","idiom":"iphone","scale":"2x","size":"60x60"},
            {"filename":"appicon-180.png","idiom":"iphone","scale":"3x","size":"60x60"},
            {"filename":"appicon-152.png","idiom":"ipad","scale":"2x","size":"76x76"},
            {"filename":"appicon-167.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
            {"filename":"appicon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
          ],"info":{"author":"xcode","version":1}}
          JSON

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd generated/ios
          xcodegen generate

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project generated/ios/BALI_COCKTAIL.xcodeproj \
            -scheme BALI_COCKTAIL \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath generated/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$(find generated/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p out/ios
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/ios/BALI-COCKTAIL-iOS-Simulator.app.zip

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: BALI-COCKTAIL-iOS-Unsigned
          path: out/ios/BALI-COCKTAIL-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 30
